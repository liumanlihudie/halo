[project]
name = "halo-gateway"
version = "0.1.0"
description = "Optional self-hosted Gateway contracts for Halo"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.128,<0.129",
  "pydantic>=2.13,<3",
  "uvicorn>=0.39,<0.40",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_gateway"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
ignore = ["UP045"]
