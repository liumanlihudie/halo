<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>聊天详情与专家资料对照</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:28px;background:#eef1f7;color:#202533;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
  h1{margin:0 0 20px;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.pair{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1fr);gap:14px;padding:16px;border-radius:20px;background:#fff;box-shadow:0 12px 32px #25304b16}.card{min-width:0}.card h2{margin:0 0 10px;font-size:14px}.card p{margin:7px 0 0;color:#707887;font-size:11px;line-height:1.5}.card img{display:block;width:100%;height:610px;border-radius:12px;background:#151515;object-fit:contain}
</style>
<h1>参考交互习惯与 Halo 视觉表达对照</h1>
<div class="grid">
  <section class="pair">
    <div class="card"><h2>参考：聊天详情</h2><img src="reference-chat-detail.jpg"><p>保留成员、记录、免打扰、置顶、背景与清理等用户预期。</p></div>
    <div class="card"><h2>Halo：聊天详情</h2><img src="01-chat-details.png"><p>改用靛蓝品牌、浅色 iOS 卡片和 AI 成果入口，不复刻原视觉。</p></div>
  </section>
  <section class="pair">
    <div class="card"><h2>参考：联系人资料</h2><img src="reference-profile.jpg"><p>保留资料、动态入口和沟通动作的熟悉层级。</p></div>
    <div class="card"><h2>Halo：专家资料</h2><img src="03-expert-profile.png"><p>加入 providerId + modelId、专家数据、主动工作和圈层权限。</p></div>
  </section>
</div>
</html>
